name: Focused numerical regression checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  numerical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies for synthetic tests only
        run: python -m pip install numpy pandas scipy statsmodels
      - name: Run isolated synthetic regression tests
        run: python tools/test_numerical_fixes.py
